buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
}
allprojects {
    repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
}
configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'
    java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
}
project(':core') {
    dependencies {
        api 'com.badlogicgames.gdx:gdx:1.13.1'
        implementation 'com.github.mgsx-dev.gdx-gltf:gltf:2.2.1'
        implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.3'
    }
}
project(':desktop') {
    apply plugin: 'application'
    dependencies {
        implementation project(':core')
        implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1'
        runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop'
        implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.3'
    }
    application { mainClass = 'journeys.hub.game.DesktopLauncher' }
    tasks.named('run') { workingDir = rootProject.projectDir }
}

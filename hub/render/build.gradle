plugins { id 'application' }
repositories { mavenCentral(); maven { url 'https://jitpack.io' } }
dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop'
    implementation 'com.github.mgsx-dev.gdx-gltf:gltf:2.2.1'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
application { mainClass = 'journeys.hub.Render' }
